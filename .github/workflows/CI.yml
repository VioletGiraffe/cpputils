name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build & test on ${{ matrix.os }}, ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Debug keeps the asserts the threading contracts are guarded with
        config: [release, debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install dependencies
      run: git clone https://github.com/VioletGiraffe/cpp-template-utils --depth 1

    - name: Linux - install a compiler with C++23 support
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update -y
        sudo apt install -qq gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 50
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 50

    - name: Windows - build & test
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: scripts\run_tests.bat ${{ matrix.config }}

    - name: Unix - build & test
      if: ${{ !startsWith(matrix.os, 'windows') }}
      run: ./scripts/run_tests.sh ${{ matrix.config }}

    # The benchmarks carry REQUIREs of their own, so release runs them; their timing-tuned checks
    # do not hold in an unoptimized build, and [.] keeps them out of every other run.
    - name: Windows - run benchmarks
      if: startsWith(matrix.os, 'windows') && matrix.config == 'release'
      shell: cmd
      run: scripts\run_tests.bat release "[benchmark]"

    - name: Unix - run benchmarks
      if: ${{ !startsWith(matrix.os, 'windows') && matrix.config == 'release' }}
      run: ./scripts/run_tests.sh release "[benchmark]"
